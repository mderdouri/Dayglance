name: Feature request
description: Suggest an improvement to Dayglance
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case this would address.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Dayglance to do?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or display context
      placeholder: Raspberry Pi model, OS, browser, and screen size
    validations:
      required: false
