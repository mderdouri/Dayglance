name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check and test hourly detail windows
        run: |
          node --check detail-hours.js
          node --test tests/test-detail-hours.js

      - name: Check and test air-quality presentation
        run: |
          node --check air-quality.js
          node --test tests/test-air-quality.js

      - name: Check Python configuration tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax
        run: sh -n launch-dayglance.sh install-autostart.sh tests/test-launcher-config.sh

      - name: Check JSON configuration
        run: python3 -m json.tool config.json > /dev/null

      - name: Check launcher configuration scenarios
        run: sh tests/test-launcher-config.sh

